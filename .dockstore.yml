version: 1.2
workflows:
  - name: chrombpnet-finemo-variant-motifs
    subclass: WDL
    primaryDescriptorPath: /workflows/annotate_variant_motifs.wdl
    testParameterFiles:
      - /finemo_pipeline/examples/inputs.variants.cd4.json
    readMePath: /finemo_pipeline/README.md
    otherFiles:
      - /workflows/discover_motifs.wdl
      - /workflows/call_motifs.wdl
    publish: true
    filters:
      branches: [main]
    topic: Five-fold REF/ALT contributions, Fi-NeMo motif gains and losses, and candidate TF annotation.
  - name: chrombpnet-finemo-peak-motifs
    subclass: WDL
    primaryDescriptorPath: /workflows/call_motifs.wdl
    testParameterFiles:
      - /finemo_pipeline/examples/inputs.peaks.cd4.json
    readMePath: /finemo_pipeline/README.md
    publish: true
    filters:
      branches: [main]
    topic: Fi-NeMo motif instances in averaged ChromBPNet peak contributions.
  - name: chrombpnet-motif-discovery
    subclass: WDL
    primaryDescriptorPath: /workflows/discover_motifs.wdl
    testParameterFiles:
      - /motif_pipeline/examples/inputs.cd4.json
    readMePath: /motif_pipeline/README.md
    publish: true
    filters:
      branches:
        - main
    topic: Five-fold ChromBPNet contribution averaging, TF-MoDISco discovery, and candidate TF motif annotation.
  - name: chrombpnet-variant-scoring
    subclass: WDL
    primaryDescriptorPath: /workflows/score_variants.wdl
    testParameterFiles:
      - /examples/inputs.json
    readMePath: /README.md
    otherFiles:
      - /examples/models.tsv
      - /examples/variants.tsv
    publish: true
    filters:
      branches:
        - main
    topic: GPU ChromBPNet variant scoring across cell-type models with merged chromatin effect tables.
  - name: chrombpnet-merge-variant-effects
    subclass: WDL
    primaryDescriptorPath: /workflows/merge_variants.wdl
    testParameterFiles:
      - /examples/merge_inputs.json
    readMePath: /README.md
    otherFiles:
      - /workflows/score_variants.wdl
    publish: true
    filters:
      branches:
        - main
    topic: Merge saved ChromBPNet variant scores and average model folds without running GPU scoring.
