name: Build and test scoring image
on:
  pull_request:
    paths: ['scripts/**']
  push:
    branches: [main]
    paths: ['scripts/**']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "SCORING_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/variant-scoring" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.SCORING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run real scorer on a synthetic model (CPU)
        run: >-
          docker run --rm --user 0
          -v "$PWD/tests:/tests:ro"
          "${SCORING_IMAGE}:${GITHUB_SHA}"
          python /tests/smoke_image.py
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${SCORING_IMAGE}:${GITHUB_SHA}"
          docker inspect --format='{{index .RepoDigests 0}}' "${SCORING_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
