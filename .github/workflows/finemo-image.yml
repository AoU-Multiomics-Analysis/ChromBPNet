name: Build and test Fi-NeMo image
on:
  pull_request:
    paths: ['finemo_pipeline/scripts/**']
  push:
    branches: [main]
    paths: ['finemo_pipeline/scripts/**']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set dedicated image name
        run: echo "FINEMO_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/finemo" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and run real motif calling and allele comparison
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: finemo_pipeline/containers/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.FINEMO_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=finemo,timeout=2m
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=finemo,mode=max,timeout=2m,ignore-error=true' || '' }}
      - name: Record published digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FINEMO_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${FINEMO_IMAGE}@${FINEMO_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
