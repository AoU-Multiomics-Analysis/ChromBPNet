name: Build and test motif image
on:
  pull_request:
    paths: ['motif_pipeline/scripts/**']
  push:
    branches: [main]
    paths: ['motif_pipeline/scripts/**']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set dedicated motif image name
        run: echo "MOTIF_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/motif-discovery" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and run real attribution, discovery, and report test
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: motif_pipeline/containers/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.MOTIF_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=motif-discovery,timeout=2m
          # Only main builds store the large CUDA layers. PRs finish after the smoke test.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=motif-discovery,mode=max,timeout=2m,ignore-error=true' || '' }}
      - name: Record published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MOTIF_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${MOTIF_IMAGE}@${MOTIF_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
