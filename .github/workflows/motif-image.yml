name: Build and test motif image
on:
  pull_request:
    paths: ['motif_pipeline/scripts/**']
  push:
    branches: [main]
    paths: ['motif_pipeline/scripts/**']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set dedicated motif image name
        run: echo "MOTIF_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/motif-discovery" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: motif_pipeline/containers/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.MOTIF_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=motif-discovery
          cache-to: type=gha,scope=motif-discovery,mode=max
      - name: Test real attribution, averaging, discovery, and reporting (CPU)
        run: >-
          docker run --rm --user 0
          -v "$PWD/tests:/tests:ro"
          "${MOTIF_IMAGE}:${GITHUB_SHA}"
          python /tests/smoke_motif_image.py
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested motif image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${MOTIF_IMAGE}:${GITHUB_SHA}"
          docker inspect --format='{{index .RepoDigests 0}}' "${MOTIF_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
