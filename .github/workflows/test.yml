name: WDL and script tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install miniwdl==1.14.2 numpy==1.26.4 h5py==3.11.0 pyfaidx==0.8.1.3
      - run: python -m unittest discover -s tests -v
      - run: miniwdl check workflows/score_variants.wdl
      - run: miniwdl check workflows/merge_variants.wdl
      - run: miniwdl check workflows/summarize_variants.wdl
      - run: miniwdl check workflows/discover_motifs.wdl
      - run: python tests/check_wdl.py workflows/score_variants.wdl
      - run: python tests/check_wdl.py workflows/merge_variants.wdl
      - run: python tests/check_wdl.py workflows/summarize_variants.wdl
      - run: python tests/check_wdl.py workflows/discover_motifs.wdl
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate WDL with Cromwell womtool 85
        run: |
          curl --fail --location --retry 3 \
            https://github.com/broadinstitute/cromwell/releases/download/85/womtool-85.jar \
            --output "$RUNNER_TEMP/womtool-85.jar"
          java -jar "$RUNNER_TEMP/womtool-85.jar" validate workflows/score_variants.wdl
          java -jar "$RUNNER_TEMP/womtool-85.jar" validate workflows/merge_variants.wdl
          java -jar "$RUNNER_TEMP/womtool-85.jar" validate workflows/summarize_variants.wdl
          java -jar "$RUNNER_TEMP/womtool-85.jar" validate workflows/discover_motifs.wdl
