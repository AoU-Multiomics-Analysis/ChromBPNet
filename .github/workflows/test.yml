name: WDL and script tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install miniwdl==1.14.2
      - run: python -m unittest discover -s tests -v
      - run: miniwdl check workflows/score_variants.wdl
      - run: python tests/check_wdl.py workflows/score_variants.wdl
